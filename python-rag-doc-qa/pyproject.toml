[tool.poetry]
name = "python-rag-doc-qa"
version = "0.1.0"
description = "A Retrieval-Augmented Generation (RAG) based document Q&A system."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
numpy = "^1.21.0"
pandas = "^1.3.0"
scikit-learn = "^0.24.0"
transformers = "^4.0.0"
torch = "^1.9.0"
faiss-cpu = "^1.7.0"
PyPDF2 = "^1.26.0"
python-docx = "^0.8.11"
markdown2 = "^2.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"